name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pure text regressions
        run: python -m unittest discover -s tests -p test_text.py
      - name: Build Windows application
        run: dotnet build src/WindowsApp/WindowsApp.csproj -c Release
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained ZIP
        shell: pwsh
        run: |
          $version='${{ github.ref_name }}'.Substring(1)
          ./scripts/Build-Release.ps1 -Version $version
      - name: Publish assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='${{ github.ref_name }}'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --repo '${{ github.repository }}' --title "Local Dictation $tag" --generate-notes }
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          gh release upload $tag release/*.zip release/SHA256SUMS.txt --repo '${{ github.repository }}' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed.' }
